[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-producer-hub"
version = "1.0.0a1"
description = "AI Music Producer Hub - Orchestrate song generation, DJ mixing, and live streaming across the fleet"
authors = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"}
]
maintainers = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
keywords = ["mcp", "ai", "music", "producer", "dj", "levo", "songgeneration", "virtualdj", "plex", "reaper", "obs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prefab-ui>=0.14.0",
    "python-rtmidi>=1.5.0",
    "mido>=1.3.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
all = [
    "ai-producer-hub[ai,dev,docs]",
]

[project.scripts]
ai-producer-hub = "ai_producer_hub.server:main"

[project.urls]
Homepage = "https://github.com/sandraschi/ai-producer-hub"
Repository = "https://github.com/sandraschi/ai-producer-hub"
Documentation = "https://ai-producer-hub.readthedocs.io/"
Issues = "https://github.com/sandraschi/ai-producer-hub/issues"
Changelog = "https://github.com/sandraschi/ai-producer-hub/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/sandraschi/ai-producer-hub/issues"
"Source Code" = "https://github.com/sandraschi/ai-producer-hub"
PyPI = "https://pypi.org/project/ai-producer-hub/"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "C90", "UP", "B", "A"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["mido.*", "rtmidi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_producer_hub"]

